# Alloy4Fun log rotation. Install (once, on the server):
#   sed "s|A4F_DIR|$HOME/a4f-prod|; s|A4F_USER|$(id -un)|; s|A4F_GROUP|$(id -gn)|" logrotate.conf | sudo tee /etc/logrotate.d/alloy4fun
# Processes keep their log files open, hence copytruncate (no restart needed).
A4F_DIR/logs/*.log {
    su A4F_USER A4F_GROUP
    weekly
    rotate 4
    compress
    delaycompress
    copytruncate
    missingok
    notifempty
}

# The API's own file log (daily files, never deleted by the API itself)
A4F_DIR/target/alloy4fun.log.* {
    su A4F_USER A4F_GROUP
    daily
    rotate 7
    compress
    missingok
    notifempty
}
