swarm:
  logging:
    loggers:
      pt.haslab.alloy4fun:
        level: INFO
      kodkod.engine.config:
        level: WARNING
    console-handlers:
      CONSOLE:
        autoflush: true
        level: DEBUG
    periodic-rotating-file-handlers:
      FILE:
        file:
          path: target/alloy4fun.log
        suffix: ".yyyy-MM-dd"
        level: DEBUG   
    root-logger:
      level: INFO
      handlers:
      - FILE
      - CONSOLE
  undertow:
    servers:
      default-server:
        http-listeners:
          default:
            max-post-size: 2147483648
